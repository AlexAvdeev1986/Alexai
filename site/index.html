<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Скрипт звонка: лизинг</title>
<style>
:root{--bg:#f1f4f2;--surface:#fff;--ink:#14201b;--mute:#5d6c65;--line:#d6ddd9;--accent:#0e6b55;--on:#fff;--say:#e2f2ea;--hint:#fff2d2;--hint-ink:#654500;--bad:#b3261e;--ok:#1e8e5a;--warm:#c98a00;--blue:#2a6fb5;--sh:0 1px 2px rgba(0,0,0,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--surface:#17211c;--ink:#e7f0ea;--mute:#9fb0a7;--line:#2c3b34;--accent:#4cc3a0;--on:#06231a;--say:#17342a;--hint:#3a2f10;--hint-ink:#f2d58a;--bad:#ff8a80;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1512;--surface:#17211c;--ink:#e7f0ea;--mute:#9fb0a7;--line:#2c3b34;--accent:#4cc3a0;--on:#06231a;--say:#17342a;--hint:#3a2f10;--hint-ink:#f2d58a;--bad:#ff8a80;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.chip.hot{background:var(--ok);color:#fff}.chip.warm{background:var(--warm);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.cold{background:var(--bad);color:#fff}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px}
.steps{max-width:1040px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line);font-style:normal}
.steps i.done{background:var(--accent);opacity:.45}.steps i.now{background:var(--accent)}
.phase{max-width:1040px;margin:0 auto;padding:0 16px 8px;font-size:13px;color:var(--mute)}
.wrap{max-width:1040px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.main{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.label{font-size:14px;color:var(--mute);font-weight:600;margin:0 0 8px}
.say{background:var(--say);border-radius:10px;padding:16px 18px;font-size:21px;line-height:1.55;margin:0 0 14px}
.say b{background:var(--hint);color:var(--hint-ink);padding:0 5px;border-radius:4px}
details{margin:0 0 16px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
details summary{cursor:pointer;font-weight:600;color:var(--mute)}
details p,details ul{margin:8px 0 0;padding-left:0}details ul{padding-left:20px}
.opts{display:grid;gap:10px}
.opt{width:100%;min-height:54px;text-align:left;padding:12px 16px;background:var(--surface);border:2px solid var(--line);border-radius:12px;font-size:17px}
.opt:hover{border-color:var(--accent)}
.opt.bad{border-style:dashed}
.btn{width:100%;min-height:54px;padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:var(--on);font-weight:600;font-size:17px}
.back{margin-top:12px;background:none;border:0;color:var(--mute);padding:8px 0;font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--hint);color:var(--hint-ink);margin-bottom:10px}
.side{position:sticky;top:120px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:calc(100vh - 140px);overflow:auto}
.side h2{font-size:15px;margin:0 0 10px}
.ob{display:block;width:100%;text-align:left;padding:10px 12px;margin:0 0 6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:15px}
.ob:hover,.ob.on{border-color:var(--accent)}.ob.on{background:var(--say)}
.fab{display:none}
@media(max-width:820px){
 .wrap{grid-template-columns:1fr;padding:12px 12px 110px}
 .say{font-size:20px}
 .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;max-height:75vh;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .2s;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
 .side.open{transform:none;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
 .fab{display:block;position:fixed;z-index:10;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-height:52px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);font-weight:600;font-size:17px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
 .fab.hide{display:none}
 .shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none}.shade.open{display:block}
}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>

<script>
var S={node:"open",obj:null,cat:"",cond:"",status:"",hist:[]};
var $=function(i){return document.getElementById(i)};

 auto:"Передаю информацию нашим партнёрам: Газпромбанк Автолизинг и Европлан. Лизинговые компании конкурируют, так что вы сравните предложения и выберете, где выгоднее. Менеджеры позвонят вам. Главное, ответьте на звонок и подтвердите потребность обоим. Вы не против?",
 eq:"Передаю информацию в Европлан. Также могу передать запрос другим партнёрам, которые финансируют оборудование: Фера, Южноуральский лизинговый центр, БСПБ Лизинг, ПР-Лизинг, Инвест-Лизинг, Лизинг-Медицина. Так вы сравните предложения. Вы не против звонков от менеджеров?",

};

open:{p:0,stage:"Скажите",
 say:"Добрый день, {fio}? Меня зовут {me}, я партнёр Газпром Лизинг, Европлан и Сберлизинг. Звоню коротко, одним вопросом: вы сейчас рассматриваете покупку в лизинг?",

 opts:[{t:"«Да, рассматриваем / есть планы»",go:"what"},{t:"«Нет, пока не рассматриваем»",go:"no"},{t:"«Уже работаем с Газпромом / Европланом»",obj:"have"},{t:"«Кто вы? Откуда номер?»",obj:"who"},{t:"«Не интересно / не нужно»",obj:"no_int",bad:1},{t:"«Занят, нет времени»",obj:"busy",bad:1}]},
what:{p:1,say:"Отлично. Что планируете приобрести?",tips:["Выберите категорию по ответу: от неё зависят партнёры на шаге согласия."],
 opts:[{t:"Авто / спецтехника",go:"isnew",set:{cat:"auto"}},{t:"Оборудование",go:"isnew",set:{cat:"eq"}},{t:"Недвижимость",go:"isnew",set:{cat:"re"}},{t:"Другое / не уточнил",go:"isnew",set:{cat:""}}]},
isnew:{p:1,say:"Интересует новое или б/у?",tips:["Если б/у, дальше спросите про аванс и срок."],
 opts:[{t:"Новое",go:"company",set:{cond:"new"}},{t:"Б/у",go:"company",set:{cond:"used"}},{t:"Изъятое",go:"company",set:{cond:"seized"}}]},
company:{p:2,say:"На какую компанию вы будете оформлять?",hook:"Без компании лид бесполезен. Задайте вопрос уверенно и дождитесь названия.",tips:["Запишите название и, если назовёт, ИНН."],
 opts:[{t:"Называет свою компанию",go:"lc"},{t:"Называет другую компанию (не свою)",go:"dir"},{t:"Не хочет называть",obj:"nocomp",bad:1}]},
dir:{p:2,say:"Вы являетесь директором этой компании?",opts:[{t:"Да",go:"lc"},{t:"Нет",go:"dirname"}]},
dirname:{p:2,say:"Подскажите, пожалуйста, ФИО директора и город компании.",tips:["Зафиксируйте контакт директора и назначьте повторный звонок."],opts:[{t:"Назвал → завершить",go:"end_blue"}]},
lc:{p:2,say:"С какой-то лизинговой компанией уже работаете?",tips:["Если называет Газпром или Европлан: вы их партнёр, и можно сравнить условия."],
 opts:[{t:"Нет / называет компанию",go:function(){return S.cond==="used"?"adv":"consent"}},{t:"«Нас всё устраивает»",obj:"have"}]},
adv:{p:2,say:"Какой аванс и на какой срок рассматриваете?",tips:["Не обсуждайте ставки и условия."],opts:[{t:"Ответил",go:"consent"}]},

 opts:[{t:"«Да, пусть звонят»",go:"end_hot"},{t:"«Подумаю / не уверен»",obj:"think",bad:1},{t:"«Не надо звонков»",obj:"nocall",bad:1},{t:"Категорично отказался",go:"end_cold",bad:1}]},
end_hot:{p:4,tag:"Горячий лид",say:"Я передам информацию менеджерам, они свяжутся с вами в ближайшее время. Ожидайте звонка. Спасибо за время, всего доброго!",tips:["Сразу занесите данные в CRM: ФИО, компания, предмет, новое/б/у, согласие."],status:"hot",end:1,opts:[]},

 opts:[{t:"«А что есть?» / проявил интерес",go:"nowhat"},{t:"«Нет, не интересно»",go:"future"}]},
nowhat:{p:1,say:"А что вас конкретно интересует?",
 opts:[{t:"Авто / спецтехника",go:"company",set:{cat:"auto",cond:"seized"}},{t:"Оборудование",go:"company",set:{cat:"eq",cond:"seized"}},{t:"Недвижимость",go:"company",set:{cat:"re",cond:"seized"}}]},
future:{p:1,say:"Подскажите, пожалуйста, в дальнейшем планируете покупку? Мы оперативно передадим запрос в компании, когда понадобится.",
 opts:[{t:"«Возможно, позже»",go:"company",status:"warm"},{t:"«Нет, не планируем»",go:"end_cold"}]},
end_cold:{p:4,tag:"Отказ",say:"Понял, спасибо за время. Если появится потребность, мы на связи. Всего доброго!",tips:["Отметка «отказ» в CRM. Не дожимайте."],status:"cold",end:1,opts:[]},
end_blue:{p:4,tag:"Нужен директор",say:"Спасибо большое! Мы свяжемся с директором. Всего доброго!",tips:["Зафиксируйте ФИО директора и город."],status:"blue",end:1,opts:[]}
};
var O={
have:{k:"Уже работаем с Газпром Лизингом / Европланом",say:"Отлично, значит, вы знаете эти компании, а я как раз их партнёр. Могу передать ваш запрос сразу нескольким лизинговым компаниям. Они сконкурируют, а вы сравните и выберете, где выгоднее. Что планируете приобрести?",tip:"Аргумент: конкуренция лизингодателей. Не критикуйте текущего поставщика.",back:"what"},
who:{k:"Кто вы? Откуда номер?",say:"Меня зовут {me}, я партнёр Газпром Лизинга, Европлана и Сберлизинга. Возможно, вы или ваши коллеги интересовались лизингом или оставляли запрос в интернете, вот я и звоню уточнить, актуально ли это сейчас. Если нет, скажите, не буду отвлекать. Вы что-то рассматриваете в лизинг?",tip:"Говорите именно «возможно», а не утверждайте, что заявка была. Если клиент отвечает «я ничего не оставлял», спокойно: «Тогда прошу прощения, контакты нашёл в открытых источниках. Кстати, есть изъятая техника со скидкой, это может быть интересно?» и переходите к блоку про изъятую технику.",back:"what"},
no_int:{k:"Не интересно / не нужно",say:"Понимаю, сейчас, возможно, нет задач. Один вопрос: бывает, что компании берут изъятую технику со скидкой. Это было бы вам интересно в будущем?",tip:"Не спорьте. Изъятая техника — мягкий второй вопрос.",back:"no"},

mail:{k:"Пришлите на почту",say:"Понимаю. Условия зависят от техники и компании, поэтому в письме будет общий текст, а менеджер лизинговой компании за пару минут по телефону назовёт конкретные условия. Давайте передам ваш контакт. Что планируете приобрести?",tip:"Почту не предлагаем. Цель: согласие на звонок менеджера. Возвращайте клиента к потребности.",back:"what"},
own:{k:"Покупаем за свои / без лизинга",say:"Понимаю. Лизинг как раз позволяет не замораживать оборотные деньги. Могу передать запрос лизингодателям, вы просто сравните их предложение со своим вариантом. Что присматриваете?",tip:"Без давления: сравнение, а не замена.",back:"what"},
later:{k:"Перезвоните позже",say:"Конечно. Давайте я сразу передам менеджерам, и они позвонят в удобное для вас время. Когда лучше? И что планируете приобрести?",tip:"Цель: согласие на звонок менеджеров и удобное время. Время фиксируйте в CRM.",back:"what"},
bank:{k:"Вы банк? Это не мошенники?",say:"Нет, я партнёр лизинговых компаний. Ничего не оформляю и не прошу данных карт. Передаю заявку менеджерам Газпром Лизинга и Европлана, они сами свяжутся с вами официально.",tip:"Не просите платёжных данных. Только компания, предмет и согласие.",back:"what"},
price:{k:"Дорого / высокие ставки",say:"Ставки и условия определяют сами лизинговые компании, я их не обещаю. Но когда они конкурируют за клиента, обычно удаётся найти лучший вариант. Давайте передам запрос, а вы сравните.",tip:"Не называйте цифр и не обещайте условий.",back:"what"},
sec:{k:"Секретарь / не директор",say:"Подскажите, пожалуйста, ФИО директора и как с ним связаться. Мы партнёр лизинговых компаний, хотим предложить условия по технике.",tip:"Цель: контакт директора или время звонка. Статус «Не директор».",back:"dirname"},
nocomp:{k:"Не хочет называть компанию",say:"Я спрашиваю, чтобы менеджеры подготовили предложение именно под вашу компанию, без этого они не смогут рассчитать условия. Подскажете название?",tip:"Если откажется, отметьте «тёплый» и вежливо закройте звонок.",back:"lc"},
think:{k:"Подумаю / не уверен",say:"Конечно, звонок ни к чему не обязывает: менеджер коротко расскажет условия, а решение за вами. Давайте передам, и вы сравните предложения.",tip:"Подчеркните, что звонок короткий и без обязательств, но не давите.",back:"consent"},

};

 var m=$("main");m.innerHTML="";

  m.appendChild(el("div","label","Скажите"));
  m.appendChild(el("p","say",ph(o.say)));
  m.appendChild(el("details","", "<summary>Совет</summary><p>"+esc(o.tip)+"</p>")).open=true;
  var b=el("button","btn","Вернуться к скрипту");
  b.onclick=function(){var k=S.obj;S.obj=null;if(k==="stop"||k==="nocall")setStatus("cold");go(O[k].back)};
  m.appendChild(b);return}
 var n=N[S.node];bar(n.p);
 if(n.tag)m.appendChild(el("span","tag",esc(n.tag)));
 m.appendChild(el("div","label","Скажите"));
 var say=typeof n.say==="function"?n.say():n.say;
 m.appendChild(el("p","say",ph(say)));
 var d="";
 if(n.hook)d+="<p>"+esc(n.hook)+"</p>";
 if(n.tips&&n.tips.length)d+="<ul>"+n.tips.map(function(t){return"<li>"+esc(t)+"</li>"}).join("")+"</ul>";
 if(d){var dt=el("details","","<summary>Подсказка менеджеру</summary>"+d);if(S.node==="open")dt.open=true;m.appendChild(dt)}
 if(n.opts.length){m.appendChild(el("div","label","Что ответил клиент?"));
  var w=el("div","opts");
  n.opts.forEach(function(op){var b=el("button","opt"+(op.bad?" bad":""),esc(op.t));
   b.onclick=function(){
    if(op.set)for(var k in op.set)S[k]=op.set[k];
    if(op.status)setStatus(op.status);
    S.hist.push(S.node);
    if(op.obj){S.obj=op.obj;render();window.scrollTo(0,0)}else go(typeof op.go==="function"?op.go():op.go);
   };w.appendChild(b)});
  m.appendChild(w)}
 if(n.end){var r=el("button","btn","Начать новый звонок");r.onclick=reset;m.appendChild(r)}
 else if(S.hist.length){var bk=el("button","back","← Назад");bk.onclick=function(){S.node=S.hist.pop()||"open";render()};m.appendChild(bk)}
}
function go(id){S.node=id;if(N[id].status)setStatus(N[id].status);render();window.scrollTo(0,0)}
function reset(){S={node:"open",obj:null,cat:"",cond:"",status:"",hist:[]};setStatus("");render();window.scrollTo(0,0)}
ORDER.forEach(function(k){var b=el("button","ob",esc(O[k].k));b.dataset.k=k;b.onclick=function(){S.obj=k;sheet(false);render();window.scrollTo(0,0)};$("objs").appendChild(b)});
$("fab").onclick=function(){sheet(true)};$("shade").onclick=function(){sheet(false)};
$("reset").onclick=reset;
render();
</script>
</body>
</html>
