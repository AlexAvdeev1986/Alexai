# /etc/nginx/sites-available/Alexai  (nginx на хосте Ubuntu, перед контейнером)
server {
    listen 80;
    server_name agentfactory.ddns.net;

    # Без этого nginx режет загрузку на 1 МБ и отдаёт 413 ещё до контейнера
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Обработка ffmpeg может идти минутами — по умолчанию было бы 60 c и ошибка 504
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Загрузку стримим дальше, готовый файл отдаём пользователю без буферизации на диск
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
